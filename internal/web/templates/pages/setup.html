{{define "content"}}
<section class="card narrow">
  <h1>Welcome</h1>
  <p>Create the admin account for this backup app. This is the only account; keep the password safe.</p>
  {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
  <form method="post" action="/setup" autocomplete="off">
    <label>Username <input type="text" name="username" value="{{.Username}}" required autofocus></label>
    <label>Password <input type="password" name="password" minlength="10" required autocomplete="new-password"></label>
    <label>Confirm password <input type="password" name="confirm" minlength="10" required autocomplete="new-password"></label>
    <p class="hint">At least 10 characters.</p>
    <button type="submit" class="primary">Create account</button>
  </form>
</section>
{{end}}
