name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root-ci-only
          MARIADB_DATABASE: citest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mariadb-dump on the runner
        run: sudo apt-get update -q && sudo apt-get install -y -q mariadb-client

      - name: Create read-only backup user and sample data
        run: |
          mariadb -h 127.0.0.1 -u root -proot-ci-only <<'SQL'
          CREATE TABLE citest.items (id INT PRIMARY KEY, name VARCHAR(50));
          INSERT INTO citest.items VALUES (1, 'one'), (2, 'two');
          CREATE VIEW citest.v_items AS SELECT id FROM citest.items;
          CREATE USER 'ro'@'%' IDENTIFIED BY 'ro-ci-only';
          GRANT SELECT, SHOW VIEW, TRIGGER, EVENT, PROCESS, LOCK TABLES ON *.* TO 'ro'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Vet
        run: go vet ./...

      - name: Test (unit + integration against read-only user)
        env:
          MARIADB_TEST_HOST: 127.0.0.1
          MARIADB_TEST_PORT: "3306"
          MARIADB_TEST_DB: citest
          MARIADB_TEST_USER: ro
          MARIADB_TEST_PASSWORD: ro-ci-only
        run: go test -race -count=1 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
